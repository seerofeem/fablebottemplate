faq:
  - ru: "Оплата при получении: наличными, картой или Kaspi QR."
    kk: "Төлем алған кезде: қолма-қол, картамен немесе Kaspi QR арқылы."
  - ru: "Курьер привозит заказ в течение 90 минут в рабочее время. Доставка только по Алматы."
    kk: "Курьер жұмыс уақытында тапсырысты 90 минут ішінде жеткізеді. Жеткізу тек Алматы бойынша."
  - ru: "Цветы можно вернуть или заменить в день доставки, если букет пришёл повреждённым."
    kk: "Гүл шоғы зақымдалып келсе, жеткізілген күні қайтаруға немесе ауыстыруға болады."
